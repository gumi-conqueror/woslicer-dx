name: Build and test

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Validate all desktop platforms (always enabled on main)
        type: boolean
        default: false

permissions:
  contents: read

env:
  WOSLICER_BUILD_PROFILE: release

concurrency:
  # Build and publication runs have separate concurrency groups.
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Quality (required)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.reuse.outputs.reused }}
      source-url: ${{ steps.reuse.outputs.source-url }}
      playwright-image: ${{ steps.browser.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check current commit identity and application version
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          node scripts/tauri-build-info.mjs
          node scripts/tauri-build-info.mjs --check
          node scripts/check-version.js
      - name: Find equivalent successful dev validation
        id: reuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-reuse.mjs probe
      - run: npm ci
        if: steps.reuse.outputs.reused != 'true'
      - run: npm run check:quality
        if: steps.reuse.outputs.reused != 'true'
      - run: npm test
        if: steps.reuse.outputs.reused != 'true'
      - name: Record the dev validation environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: node scripts/ci-reuse.mjs record
      - name: Upload the dev validation environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-environment-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation-environment.json
          if-no-files-found: error
          retention-days: 2
      - name: Select the browser image from the dependency lockfile
        id: browser
        run: |
          node -e 'const version = require("./package-lock.json").packages["node_modules/playwright"].version; console.log(`image=mcr.microsoft.com/playwright:v${version}-noble`)' >> "$GITHUB_OUTPUT"

  web:
    name: Web (required)
    needs: quality
    if: needs.quality.outputs.reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ${{ needs.quality.outputs.playwright-image }}
      options: --user 1001 --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the source commit time for all build identities
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - name: Test the production web output (isolated 30-second profiles)
        run: npm run test:app-ui
      - name: Archive and validate the tested web output
        run: |
          node scripts/package-web.mjs
          node scripts/release-artifacts.mjs record release/web web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: woslicer-web-release-${{ github.sha }}
          path: release/web/*
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14
      - name: Upload web diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-web-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-artifacts/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  windows-x64:
    name: Windows x64 (required)
    needs: quality
    if: needs.quality.outputs.reused != 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-desktop
        with:
          platform: windows-x64
          target: x86_64-pc-windows-msvc
          profile: ${{ github.ref == 'refs/heads/main' && 'release' || 'debug' }}

  additional-desktop:
    name: ${{ matrix.platform }}
    needs: quality
    if: github.ref == 'refs/heads/main' || inputs.all_platforms
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-desktop
        with:
          platform: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          profile: ${{ github.ref == 'refs/heads/main' && 'release' || 'debug' }}
          bundles: ${{ matrix.bundles || '' }}

  required:
    name: Required release checks
    if: always()
    needs: [quality, web, windows-x64, additional-desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all selected targets to succeed
        env:
          REUSED: ${{ needs.quality.outputs.reused }}
          SOURCE_URL: ${{ needs.quality.outputs.source-url }}
          INTERNAL_RELEASE_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          WEB_RESULT: ${{ needs.web.result }}
          WINDOWS_RESULT: ${{ needs.windows-x64.result }}
          OTHER_RESULT: ${{ needs.additional-desktop.result }}
        run: |
          test "$QUALITY_RESULT" = success
          if [[ "$REUSED" == true ]]; then
            test "$INTERNAL_RELEASE_PR" = true
            test -n "$SOURCE_URL"
            test "$WEB_RESULT" = skipped
            test "$WINDOWS_RESULT" = skipped
            test "$OTHER_RESULT" = skipped
            printf 'Source validation reused: %s\n' "$SOURCE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            test "$WEB_RESULT" = success
            test "$WINDOWS_RESULT" = success
          fi
          [[ "$OTHER_RESULT" == success || "$OTHER_RESULT" == skipped ]]
